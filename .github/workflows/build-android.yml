name: Build Android APK and AAB Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'client/public/manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android Platform 36 and Build Tools 36.1.0
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;36.1.0" "platforms;android-36"

      - name: Configure Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generate Release Keystore
        working-directory: ./android
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KniteMedicoPass2026!" \
            -keypass "KniteMedicoPass2026!" \
            -dname "CN=KNITE Infotech, OU=Software, O=KNITE Infotech, L=Coimbatore, ST=Tamil Nadu, C=IN"

      - name: Generate Android Project (Zero-Prompt)
        working-directory: ./android
        run: |
          bubblewrap update --skipVersionUpgrade
          chmod +x gradlew

      - name: Compile and Build APK and AAB Bundle
        working-directory: ./android
        run: |
          echo "Building Gradle Release..."
          ./gradlew assembleRelease bundleRelease --stacktrace > build.log 2>&1 || BUILD_FAILED=1
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "## ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log | tail -n 80
            exit 1
          fi
          echo "Gradle compilation succeeded!"

      - name: Sign APK and AAB Bundle
        working-directory: ./android
        run: |
          echo "Signing APK..."
          find app/build/outputs/ -type f
          UNSIGNED_APK=$(find app/build/outputs/ -name "*release*.apk" | head -n 1)
          ${ANDROID_HOME}/build-tools/36.1.0/apksigner sign \
            --ks android.keystore \
            --ks-pass pass:KniteMedicoPass2026! \
            --ks-key-alias android \
            --key-pass pass:KniteMedicoPass2026! \
            --out knite-medico-release.apk \
            "$UNSIGNED_APK"
          
          echo "Signing AAB Bundle..."
          UNSIGNED_AAB=$(find app/build/outputs/ -name "*release*.aab" | head -n 1)
          jarsigner -keystore android.keystore \
            -storepass "KniteMedicoPass2026!" \
            -keypass "KniteMedicoPass2026!" \
            "$UNSIGNED_AAB" \
            android
          cp "$UNSIGNED_AAB" knite-medico-playstore.aab
          echo "Signing complete!"

      - name: Upload APK (For Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-release-apk
          path: android/knite-medico-release.apk

      - name: Upload AAB Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-playstore-aab
          path: android/knite-medico-playstore.aab

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
