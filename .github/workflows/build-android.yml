name: Build Android APK and AAB Bundle

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'client/public/manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize Android Project from PWA Manifest
        run: |
          mkdir -p android-build
          cd android-build
          bubblewrap init --manifest="https://knitemedico.kniteinfotech.in/manifest.json" --directory=.

      - name: Generate Release Keystore
        run: |
          cd android-build
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KniteMedicoPass2026!" \
            -keypass "KniteMedicoPass2026!" \
            -dname "CN=KNITE Infotech, OU=Software, O=KNITE Infotech, L=Coimbatore, ST=Tamil Nadu, C=IN"

      - name: Build Signed APK and AAB Bundle
        run: |
          cd android-build
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-release-apk
          path: android-build/*.apk

      - name: Upload AAB Bundle Artifact (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-playstore-aab
          path: android-build/*.aab
