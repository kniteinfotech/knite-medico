name: Build Android APK and AAB Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'client/public/manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android Platform 36 and Build Tools 36.1.0
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;36.1.0" "platforms;android-36"

      - name: Configure Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generate Release Keystore
        working-directory: ./android
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KniteMedicoPass2026!" \
            -keypass "KniteMedicoPass2026!" \
            -dname "CN=KNITE Infotech, OU=Software, O=KNITE Infotech, L=Coimbatore, ST=Tamil Nadu, C=IN"

      - name: Generate Android Project (Zero-Prompt)
        working-directory: ./android
        run: |
          bubblewrap update --skipVersionUpgrade
          chmod +x gradlew

      - name: Build Signed APK and AAB Bundle
        working-directory: ./android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "KniteMedicoPass2026!"
          BUBBLEWRAP_KEY_PASSWORD: "KniteMedicoPass2026!"
        run: |
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload APK (For Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-release-apk
          path: android/*.apk

      - name: Upload AAB Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: knite-medico-playstore-aab
          path: android/*.aab
